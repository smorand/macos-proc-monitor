[package]
name = "macos-proc-core"
version = "0.1.0"
edition = "2021"
description = "macOS process monitor core: metrics collection + web dashboard"
license = "MIT"

[lib]
name = "procmon"
path = "src/lib.rs"

[dependencies]
sysinfo   = "0.39"
serde     = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono    = { version = "0.4", features = ["serde"] }
tracing             = "0.1"
tracing-subscriber  = { version = "0.3", features = ["fmt", "env-filter", "chrono"] }
uzers     = "0.12"
arrow     = { version = "53", features = [] }
parquet   = { version = "53", features = ["arrow"] }
duckdb    = { version = "1", features = ["bundled"] }
axum      = "0.7"
tokio     = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors"] }
anyhow    = "1"

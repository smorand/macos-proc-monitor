[package]
name = "macos-proc-monitor"
version = "0.1.0"
edition = "2021"
description = "macOS process metrics daemon: collects per-process metrics and serves a web dashboard"
license = "MIT"

[[bin]]
name = "macos-proc-monitor"
path = "src/main.rs"

[dependencies]
macos-proc-core = { path = "../core" }
clap      = { version = "4.6", features = ["derive", "env"] }
tokio     = { version = "1", features = ["full"] }
tracing   = "0.1"
anyhow    = "1"

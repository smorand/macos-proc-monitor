[workspace]
members = ["crates/core", "crates/macos-proc-monitor"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "MIT"
authors = ["Sebastien MORAND <seb.morand@gmail.com>"]
repository = "https://github.com/smorand/macos-proc-monitor"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"

[workspace.dependencies]
sysinfo = "0.39"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "chrono"] }
tracing-appender = "0.2"
uzers = "0.12"
arrow = { version = "53", features = [] }
parquet = { version = "53", features = ["arrow"] }
duckdb = { version = "1", features = ["bundled"] }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "signal"] }
tower-http = { version = "0.5", features = ["cors", "trace", "timeout"] }
anyhow = "1"
thiserror = "2"
figment = { version = "0.10", features = ["toml", "env"] }
etcetera = "0.11"
clap = { version = "4.6", features = ["derive", "env"] }
tokio-util = "0.7"

[profile.release]
opt-level = 3
lto = "fat"
strip = true
codegen-units = 1

[profile.release-dist]
inherits = "release"
panic = "abort"

[profile.dev.package."*"]
opt-level = 3
